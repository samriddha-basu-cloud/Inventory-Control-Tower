{% extends "base.html" %}
{% block title %}Inventory Heatmap{% endblock %}
{% block content %}
<div class="ict-section-title">SKU × Location Heatmap</div>
<div class="d-flex gap-2 mb-3">
  {% for m in ['days_of_supply', 'value', 'stockout_risk'] %}
    <a href="{{ url_for('network.heatmap', metric=m) }}" class="btn btn-sm {{ 'btn-primary' if metric==m else 'btn-outline-secondary' }}">{{ m.replace('_',' ')|title }}</a>
  {% endfor %}
</div>
<div id="heatmap" class="ict-card" style="height:640px;"></div>
{% endblock %}

{% block extra_scripts %}
<script>
Plotly.newPlot('heatmap', [{
  z: {{ z_values | safe }}, x: {{ x_labels | safe }}, y: {{ y_labels | safe }},
  type: 'heatmap', colorscale: 'YlOrRd', hoverongaps: false,
}], {margin: {t:20,l:80,r:10,b:60}}, {responsive: true});
</script>
{% endblock %}
