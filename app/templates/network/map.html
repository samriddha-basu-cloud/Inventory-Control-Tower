{% extends "base.html" %}
{% block title %}Network Map{% endblock %}
{% block content %}
<div class="ict-section-title">Supply Network Map</div>
<div class="ict-section-sub">Nodes sized by on-hand units; supplier lanes shown in red where the linked PO is currently delayed.</div>
<div id="network-map" class="ict-card" style="height:560px;"></div>
{% endblock %}

{% block extra_scripts %}
<script>
const nodes = {{ nodes_json | safe }};
const edges = {{ edges_json | safe }};
const byId = {};
nodes.forEach(n => byId[n.id] = n);

// Nodes without lat/lon (suppliers) get placed on a ring to the left.
let ring = 0;
nodes.forEach(n => { if (n.lat === null) { n.lat = 8 + (ring % 4) * 6; n.lon = 65; ring++; } });

const edgeTraces = edges.map(e => {
  const s = byId[e.source], t = byId[e.target];
  if (!s || !t) return null;
  return {
    x: [s.lon, t.lon], y: [s.lat, t.lat], mode: 'lines', type: 'scatter',
    line: {color: e.delayed ? '#dc2626' : '#94a3b8', width: e.delayed ? 3 : 1.5, dash: e.type === 'supply' ? 'dot' : 'solid'},
    hoverinfo: 'skip', showlegend: false,
  };
}).filter(Boolean);

const typeColor = {supplier: '#7c3aed', plant: '#0891b2', dc: '#2563eb', store: '#16a34a'};
const nodeTrace = {
  x: nodes.map(n => n.lon), y: nodes.map(n => n.lat), mode: 'markers+text', type: 'scatter',
  text: nodes.map(n => n.id), textposition: 'top center', textfont: {size: 10},
  marker: {
    size: nodes.map(n => n.on_hand ? Math.max(14, Math.min(46, Math.sqrt(n.on_hand)/6)) : 16),
    color: nodes.map(n => typeColor[n.type] || '#64748b'),
  },
  hovertext: nodes.map(n => `${n.name} (${n.type})<br>On hand: ${n.on_hand ?? '—'}<br>Utilization: ${n.utilization_pct ?? '—'}%`),
  hoverinfo: 'text',
};

Plotly.newPlot('network-map', [...edgeTraces, nodeTrace], {
  showlegend: false, xaxis: {visible: false}, yaxis: {visible: false},
  margin: {t:20,l:10,r:10,b:10},
}, {responsive: true});
</script>
{% endblock %}
