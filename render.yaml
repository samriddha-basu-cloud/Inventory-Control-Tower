services:
  - type: web
    name: inventory-control-tower
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL          # point at a Render PostgreSQL instance
        fromDatabase:
          name: ict-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_REQUIRED
        value: "1"
      - key: API_KEY
        sync: false
databases:
  - name: ict-db
    plan: free
