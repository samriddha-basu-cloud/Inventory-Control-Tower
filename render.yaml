services:
  - type: web
    name: inventory-control-tower
    env: python
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ict-postgres
          property: connectionString
      - key: UPLOAD_LIMIT_MB
        value: "25"

databases:
  - name: ict-postgres
    plan: starter
    databaseName: ict
    user: ict
